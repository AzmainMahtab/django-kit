[importlinter]
root_package = backend

[importlinter:contract:shared-no-business-imports]
name = shared/ must contain zero business logic imports
type = forbidden
source_modules =
    backend.shared
forbidden_modules =
    backend.apps.car
    backend.apps.catalog
    backend.apps.identity
    backend.apps.notification
    backend.apps.ordering
    backend.apps.owner
    backend.apps.otp
    backend.apps.payment
    backend.apps.promotion
    backend.apps.rbac
ignore_imports =
    backend.shared.permissions -> backend.core.container
    backend.shared.admin_backend -> backend.core.container

# Note: backend.apps.event_outbox is intentionally omitted because it is pure
# event-bus infrastructure, not business logic. The shared event bus needs to
# persist outbox/store/dead-letter records.

# ---------------------------------------------------------------------------
# Per-app domain isolation: each app may not import another app's domain
# modules. This is the code-level boundary rule; DB FK constraints are a
# separate layer handled by the architecture decision.
# car and owner are the baseline modules for this enforcement.
# ---------------------------------------------------------------------------

[importlinter:contract:car-domain-isolation]
name = car must not import other apps' domain modules
type = forbidden
source_modules = backend.apps.car
forbidden_modules =
    backend.apps.identity.domain
    backend.apps.notification.domain
    backend.apps.ordering.domain
    backend.apps.owner.domain
    backend.apps.otp.domain
    backend.apps.rbac.domain
ignore_imports =
    backend.apps.car.interfaces.views -> backend.core.container
    backend.shared.permissions -> backend.core.container

