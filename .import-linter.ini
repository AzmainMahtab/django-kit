[importlinter]
root_package = backend

[importlinter:contract:shared-no-business-imports]
name = shared/ must contain zero business logic imports
type = forbidden
source_modules =
    backend.shared
forbidden_modules =
    backend.apps.identity
    backend.apps.otp
    backend.apps.rbac
    backend.apps.owner
    backend.apps.car
    backend.apps.ordering
    backend.apps.notification

# Note: backend.apps.event_outbox is intentionally omitted because it is pure
# event-bus infrastructure, not business logic. The shared event bus needs to
# persist outbox/store/dead-letter records.
