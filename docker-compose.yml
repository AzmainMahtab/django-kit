services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_init}
      POSTGRES_USER: ${POSTGRES_USER:-django_init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_init}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django_init} -d ${POSTGRES_DB:-django_init}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: ${DOCKER_TARGET:-dev}
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: backend.core.settings.base_settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-django_init}
      POSTGRES_USER: ${POSTGRES_USER:-django_init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_init}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      target: ${DOCKER_TARGET:-dev}
    command: ["celery", "-A", "backend.core", "worker", "-l", "info"]
    environment:
      DJANGO_SETTINGS_MODULE: backend.core.settings.base_settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-django_init}
      POSTGRES_USER: ${POSTGRES_USER:-django_init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_init}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      target: ${DOCKER_TARGET:-dev}
    command: ["celery", "-A", "backend.core", "beat", "-l", "info"]
    environment:
      DJANGO_SETTINGS_MODULE: backend.core.settings.base_settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-django_init}
      POSTGRES_USER: ${POSTGRES_USER:-django_init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_init}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: .
      target: ${DOCKER_TARGET:-dev}
    command: ["celery", "-A", "backend.core", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    environment:
      DJANGO_SETTINGS_MODULE: backend.core.settings.base_settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-django_init}
      POSTGRES_USER: ${POSTGRES_USER:-django_init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_init}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
